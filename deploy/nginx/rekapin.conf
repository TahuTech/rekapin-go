# Nginx (host) -> Rekapin di Docker (127.0.0.1:8081), subdomain terpisah dari project utama.
# Pasang:
#   sudo cp deploy/nginx/rekapin.conf /etc/nginx/sites-available/rekapin.conf
#   sudo sed -i 's/rekap.example.com/rekap.domainanda.com/' /etc/nginx/sites-available/rekapin.conf
#   sudo ln -s /etc/nginx/sites-available/rekapin.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rekap.domainanda.com      # HTTPS + redirect otomatis

upstream rekapin {
    server 127.0.0.1:8081;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name rekap.example.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://rekapin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Host wajib diteruskan: proteksi CSRF (http.CrossOriginProtection)
        # membandingkan header Origin dengan Host (termasuk port, karena itu $http_host).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass http://rekapin;
        proxy_set_header Host $http_host;
        expires 7d;  # Cache-Control: max-age=604800
    }

    gzip on;
    gzip_types text/css application/javascript text/plain application/json;
}
