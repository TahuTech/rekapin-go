# Deploy produksi di VPS. Jalankan lewat `make prod-up` (membaca .env.prod).
name: rekapin-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rekapin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-rekapin}
    # Tuning VPS 1 GB / 1 core (sama dengan deploy/postgresql.conf.snippet).
    command: >-
      postgres
      -c max_connections=20
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=4MB
      -c max_worker_processes=2
      -c max_parallel_workers=1
      -c max_parallel_workers_per_gather=0
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c min_wal_size=80MB
      -c max_wal_size=512MB
      -c log_min_duration_statement=500ms
    # Default hanya localhost; akses dari luar lewat SSH tunnel atau set DB_BIND=0.0.0.0.
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128m
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: rekapin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rekapin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rekapin}?sslmode=disable
      ADDR: 0.0.0.0:8080
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-5}
      COMPANY_NAME: ${COMPANY_NAME:-Rekapin}
      COMPANY_INFO: ${COMPANY_INFO:-}
      # Batasi heap Go agar GC agresif di VPS kecil (sama dengan deploy/rekapin.service).
      GOMEMLIMIT: 128MiB
      GOMAXPROCS: "1"
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8081}:8080"
    mem_limit: 256m
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
