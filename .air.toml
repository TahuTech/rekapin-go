# Konfigurasi hot reload (dipakai oleh container app di compose.yaml).
root = "."
tmp_dir = "tmp"

[build]
  # Template di-embed ke binary, jadi perubahan .html juga perlu rebuild.
  # Tailwind dibangun dulu agar class baru di template ikut ter-generate.
  pre_cmd = ["tailwindcss -i web/tailwind/input.css -o web/static/app.css --minify"]
  cmd = "go build -o ./tmp/rekapin ./cmd/rekapin"
  entrypoint = ["./tmp/rekapin", "serve"]
  include_ext = ["go", "html", "css", "js", "sql"]
  exclude_dir = ["bin", "tmp", "deploy", ".git"]
  exclude_file = ["web/static/app.css"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true
  # Aktifkan bila perubahan file tidak terdeteksi (mis. Docker Desktop di macOS/Windows).
  poll = false

[log]
  time = false

[misc]
  clean_on_exit = true
