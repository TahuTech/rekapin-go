{{define "title"}}Masuk{{end}}
{{define "content"}}
<div class="grid min-h-screen place-items-center px-4">
  <form method="post" action="/login" class="card w-full max-w-sm space-y-4 p-8" hx-boost="false">
    <div class="text-center">
      <span class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-xl bg-indigo-600 text-xl font-bold text-white">R</span>
      <h1 class="text-xl font-semibold">Masuk Admin</h1>
      <p class="text-sm text-slate-500">{{.Company}}</p>
    </div>
    {{template "error" .Error}}
    <label class="block">
      <span class="label">Username</span>
      <input name="username" value="{{.Username}}" class="input" autocomplete="username" required autofocus>
    </label>
    <label class="block">
      <span class="label">Password</span>
      <input name="password" type="password" class="input" autocomplete="current-password" required>
    </label>
    <button class="btn-primary w-full justify-center">Masuk</button>
  </form>
</div>
{{end}}
