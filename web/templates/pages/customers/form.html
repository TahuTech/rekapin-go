{{define "title"}}{{if .Customer.ID}}Edit{{else}}Tambah{{end}} Customer{{end}}
{{define "content"}}
{{$c := .Customer}}
<div class="mb-6">
  <a href="{{if $c.ID}}/customers/{{$c.ID}}{{else}}/customers{{end}}" class="link text-sm">← Kembali</a>
  <h1 class="page-title mt-1">{{if $c.ID}}Edit Customer{{else}}Tambah Customer{{end}}</h1>
</div>
<form method="post" action="{{if $c.ID}}/customers/{{$c.ID}}{{else}}/customers{{end}}" class="card max-w-2xl space-y-4 p-6">
  {{template "error" .Error}}
  <label class="block"><span class="label">Nama *</span><input name="name" value="{{$c.Name}}" class="input" required autofocus></label>
  <label class="block"><span class="label">No. HP</span><input name="phone" value="{{$c.Phone}}" class="input" inputmode="tel"></label>
  <label class="block"><span class="label">Alamat</span><textarea name="address" rows="2" class="input">{{$c.Address}}</textarea></label>
  <label class="block"><span class="label">Catatan</span><textarea name="notes" rows="2" class="input">{{$c.Notes}}</textarea></label>
  <div class="flex justify-end gap-2 pt-2">
    <button class="btn-primary">Simpan</button>
  </div>
</form>
{{if $c.ID}}
<form method="post" action="/customers/{{$c.ID}}/archive" class="mt-4 max-w-2xl text-right" hx-confirm="Arsipkan customer ini? Histori transaksi tetap tersimpan.">
  <button class="text-sm text-rose-600 hover:underline">Arsipkan customer</button>
</form>
{{end}}
{{end}}
